<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GaitIMU Data Collection</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 1rem; }
    button { padding: 10px 15px; margin: 5px; font-size: 1rem; cursor: pointer; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    .status { margin-top: 20px; padding: 10px; background: #f4f4f4; border-radius: 5px; }
    .log { height: 150px; overflow-y: scroll; background: #222; color: #0f0; padding: 10px; font-family: monospace; font-size: 0.85rem; }
  </style>
</head>
<body>

  <h2>GaitIMU Data Collection Tool</h2>
  <p>3 × ESP32-C3 + MPU-6050, 200 Hz, Web Bluetooth.</p>

  <div>
    <button id="btnPair">Pair Modules (BLE)</button>
    <button id="btnStartStream" disabled>▶ Start Streaming</button>
    <button id="btnStopStream" disabled>■ Stop Streaming</button>
  </div>
  <div>
    <button id="btnStartRec" disabled>● Start Recording</button>
    <button id="btnStopRec" disabled>■ Stop Recording</button>
    <button id="btnDownload" disabled>↓ Download CSV</button>
  </div>

  <div class="status">
    <strong>Status:</strong> <span id="statusText">Not paired</span><br>
    <strong>Samples Collected:</strong> <span id="sampleCount">0</span>
  </div>

  <h3>Event Log</h3>
  <div id="log" class="log"></div>

  <script>
    const SERVICE_UUID = '9f000001-8c5a-4e1f-9a7b-3d6e5f0a1b2c';
    const CMD_UUID     = '9f000002-8c5a-4e1f-9a7b-3d6e5f0a1b2c';
    const TIME_UUID    = '9f000003-8c5a-4e1f-9a7b-3d6e5f0a1b2c';
    const DATA_UUID    = '9f000004-8c5a-4e1f-9a7b-3d6e5f0a1b2c';
    const ID_UUID      = '9f000005-8c5a-4e1f-9a7b-3d6e5f0a1b2c';

    let devices = [];
    let allSamples = [];
    let isRecording = false;
    let lastSeq = {};

    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('statusText');
    const countEl = document.getElementById('sampleCount');

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `[${time}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // UI Buttons
    document.getElementById('btnPair').onclick = pairDevices;
    document.getElementById('btnStartStream').onclick = () => sendCmd(0x01);
    document.getElementById('btnStopStream').onclick = () => sendCmd(0x02);
    document.getElementById('btnStartRec').onclick = () => { isRecording = true; log("Recording started"); };
    document.getElementById('btnStopRec').onclick = () => { isRecording = false; log("Recording stopped"); document.getElementById('btnDownload').disabled = false; };
    document.getElementById('btnDownload').onclick = downloadCSV;

    async function pairDevices() {
      devices = [];
      const names = ['GaitIMU-Torso', 'GaitIMU-LeftLeg', 'GaitIMU-RightLeg'];
      
      for (let name of names) {
        try {
          log(`Searching for ${name}...`);
          const device = await navigator.bluetooth.requestDevice({
            filters: [{ name: name }],
            optionalServices: [SERVICE_UUID]
          });
          
          device.addEventListener('gattserverdisconnected', () => log(`${name} disconnected`));
          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(SERVICE_UUID);
          
          const idChar = await service.getCharacteristic(ID_UUID);
          const idVal = new TextDecoder().decode(await idChar.readValue());
          
          const timeChar = await service.getCharacteristic(TIME_UUID);
          const dataChar = await service.getCharacteristic(DATA_UUID);
          
          await syncTime(timeChar);
          await dataChar.startNotifications();
          dataChar.addEventListener('characteristicvaluechanged', (e) => handleData(e, idVal));
          
          devices.push({ name: idVal, service, timeChar, dataChar, device });
          log(`Connected to ${idVal}`);
        } catch (err) {
          log(`Failed to pair ${name}: ${err.message}`);
        }
      }
      
      if (devices.length > 0) {
        statusEl.innerText = `${devices.length} modules paired`;
        document.getElementById('btnStartStream').disabled = false;
        document.getElementById('btnStartRec').disabled = false;
      }
    }

    async function syncTime(timeChar) {
      const now = Date.now();
      const sec = Math.floor(now / 1000);
      const ms10 = now % 1000;
      
      const buf = new ArrayBuffer(6);
      const view = new DataView(buf);
      view.setUint32(0, sec, true);
      view.setUint16(4, ms10, true);
      
      await timeChar.writeValue(buf);
    }

    async function sendCmd(cmd) {
      for (let d of devices) {
        const cmdChar = await d.service.getCharacteristic(CMD_UUID);
        await cmdChar.writeValue(new Uint8Array([cmd]));
      }
      log(`Sent CMD ${cmd} to all modules`);
      document.getElementById('btnStopStream').disabled = (cmd === 0x02);
      document.getElementById('btnStartStream').disabled = (cmd === 0x01);
    }

    function handleData(event, moduleId) {
      const value = event.target.value;
      const view = new DataView(value.buffer);
      
      const seq = view.getUint8(0);
      const N = view.getUint8(1);
      const tFirst = view.getUint32(2, true); // Device ms since sync
      
      // FIX: Track sequence numbers to detect over-the-air drops
      if (lastSeq[moduleId] !== undefined && seq !== (lastSeq[moduleId] + 1) % 256) {
        console.warn(`⚠️ DROP on ${moduleId}: expected ${(lastSeq[moduleId] + 1) % 256}, got ${seq}`);
        log(`⚠️ Packet drop detected on ${moduleId}`);
      }
      lastSeq[moduleId] = seq;

      // Calculate base epoch for this packet
      // Note: For exact sync, you'd use the round-trip time offset from syncTime(). 
      // Here we use a simplified offset mapping.
      const baseEpoch = Date.now() - tFirst; 

      for (let i = 0; i < N; i++) {
        const offset = 6 + (i * 12);
        const ax = view.getInt16(offset + 0, true) * 0.000244;
        const ay = view.getInt16(offset + 2, true) * 0.000244;
        const az = view.getInt16(offset + 4, true) * 0.000244;
        const gx = view.getInt16(offset + 6, true) * 0.0305;
        const gy = view.getInt16(offset + 8, true) * 0.0305;
        const gz = view.getInt16(offset + 10, true) * 0.0305;
        
        const device_ms = tFirst + (i * 5); // 200Hz = 5ms per sample
        const unix_time_ms = baseEpoch + device_ms;

        if (isRecording) {
          allSamples.push({
            module: moduleId,
            unix_time_ms: unix_time_ms,
            device_ms: device_ms,
            ax_g: ax.toFixed(4),
            ay_g: ay.toFixed(4),
            az_g: az.toFixed(4),
            gx_dps: gx.toFixed(2),
            gy_dps: gy.toFixed(2),
            gz_dps: gz.toFixed(2)
          });
        }
      }
      countEl.innerText = allSamples.length;
    }

    function downloadCSV() {
      if (allSamples.length === 0) {
        alert("No data recorded!");
        return;
      }

      // FIX: Sort chronologically before generating CSV to fix out-of-order BLE arrivals
      allSamples.sort((a, b) => a.unix_time_ms - b.unix_time_ms);

      const header = "module,unix_time_ms,timestamp_iso,device_ms,ax_g,ay_g,az_g,gx_dps,gy_dps,gz_dps\n";
      const rows = allSamples.map(s => {
        const iso = new Date(s.unix_time_ms).toISOString();
        return `${s.module},${s.unix_time_ms},${iso},${s.device_ms},${s.ax_g},${s.ay_g},${s.az_g},${s.gx_dps},${s.gy_dps},${s.gz_dps}`;
      }).join('\n');

      const blob = new Blob([header + rows], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const dateStr = new Date().toISOString().replace(/[:.]/g, '-');
      a.download = `gait_imu_${dateStr}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      log("CSV Downloaded successfully");
    }
  </script>
</body>
</html>
